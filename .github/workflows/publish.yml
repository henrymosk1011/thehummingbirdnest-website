# Publish main to the live site.
#
# Cloudflare Workers Builds does not receive this repository's GitHub push events, so this
# workflow starts the production build instead: every push to main (a merged pull request,
# an edit on github.com, or a save in Pages CMS) calls the Worker's deploy hook. Cloudflare
# then runs `npm run build` and `npm run deploy:ci` (`wrangler deploy` with retries).
#
# The deploy hook URL is kept in the repository secret CLOUDFLARE_DEPLOY_HOOK (see DEPLOY.md,
# section 1). Anyone holding the URL can start a build, so it never goes in a file. Until the
# secret is set, this workflow only prints a reminder.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-main
  cancel-in-progress: true

jobs:
  deploy-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start the Cloudflare production build
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::CLOUDFLARE_DEPLOY_HOOK is not set, so this push was not published. See DEPLOY.md, section 7."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --max-time 30 -X POST "$HOOK"
          echo
          echo "Cloudflare accepted the build. Progress: Workers and Pages > thehummingbirdnest > Deployments."
